name: Branch name

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  validate:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^(feature|hotfix|fix|chore|docs|release)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Use <type>/<short-description>, for example feature/client-timeout."
            exit 1
          fi
